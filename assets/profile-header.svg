<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Thang Dang — Full-Stack Developer</title>
  <desc id="desc">A dark technical banner with blue and green accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101b31"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1080" cy="70" r="130" fill="#38bdf8" fill-opacity=".11" filter="url(#glow)"/>
  <circle cx="1025" cy="300" r="120" fill="#4ade80" fill-opacity=".08" filter="url(#glow)"/>

  <g transform="translate(72 74)">
    <rect x="0" y="0" width="54" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="76" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="58" font-weight="700" letter-spacing="-2">Thang Dang</text>
    <text x="2" y="124" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22">Full-Stack Developer · 15+ years of experience</text>
    <text x="2" y="180" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">Web applications · Business systems · APIs · Production</text>
  </g>

  <g transform="translate(968 100) scale(2.5)">
    <rect width="64" height="64" rx="14" fill="#0a192f"/>
    <path d="M24 21 13 32l11 11" fill="none" stroke="#64ffda" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 21 51 32 40 43" fill="none" stroke="#64ffda" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m35 18-6 28" fill="none" stroke="#ccd6f6" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
